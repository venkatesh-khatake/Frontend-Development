<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConnect</title>
</head>
<body>
    <h1>User Registration Form</h1>
    <form action="" method="post">
        <label for="name">Full Name :</label>
        <input type="text" id = "name" name="fullName" placeholder="Enter your Full Name" required>
        <br>
        <label for="email">Email : </label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="password">Password : </label>
        <input type="password" id="password" name = "password" required>
        <br>
        <label for="age">Age : </label>
        <input type="number" id="age" name="age" min="18">
        <br>
        <p>Gender : </p>
        <input type="radio" name="gender" id="male" value="male" required>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">female</label>
        <input type="radio" name="gender" id = "other" value="other">
        <label for="other">Other</label>
        <br>
        <p>Skills : </p>
        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" name="skills" id="css" value="CSS">
                <label for="css">CSS</label>

        <input type="checkbox" name="skills" id="js" value="JavaScript">
                <label for="js">JavaScript</label>

        <input type="checkbox" name="skills" id="react" value="React">
                <label for="react">React</label>

        <br>
        <label for="country">Country : </label>
        <select name="country" id="country" required>
            <option value="select country" disabled>Select country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
            
        </select>

        <br>
        <label for="about">About You : </label>
        <textarea name="about" id="about" required></textarea>
<br>
        <label for="terms">Terms & Conditions</label>
        <input type="checkbox" id="terms" name="terms" required>
<br>
        <input type="submit">

    </form>
</body>
</html>
